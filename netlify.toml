# Hosting configuration for Sky Window Design & More.
#
# This was a Next.js static export publishing a copied dist/. The blog's CMS
# needs a dynamic page and a route handler (/keystatic and
# /api/keystatic/[...params]), neither of which a static export can serve, so
# the site now deploys through Netlify's Next runtime and publishes .next —
# the same setup as the rest of the portfolio. Pages are still prerendered.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.4.1"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"
